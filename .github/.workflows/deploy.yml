name: Deploy to GitHub Pages

# 1. 触发条件保持不变
on:
  push:
    branches: ["feat"]
  workflow_dispatch:

# 2. 为新版部署设置必要的权限
permissions:
  contents: read        # 用于拉取代码
  pages: write          # 用于部署到 GitHub Pages
  id-token: write       # 用于验证部署来源

# 3. 定义一个名为 "build-and-deploy" 的任务
jobs:
  build-and-deploy:
    # 指定运行环境
    runs-on: ubuntu-latest
    # 部署任务需要依赖构建任务，但这里我们将两个步骤合并在一个任务中
    # 如果需要分离，可以拆成 build 和 deploy 两个 job
    steps:
      # 4. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 5. 设置 Node.js 环境
      - name: 设置 Node.js 环境
        # uses: actions/setup-node@v4
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"

      # 6. 安装依赖并构建
      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build
        # 请确保构建命令的输出目录是 './build'，如不是请修改下方步骤的 path 参数

      # 7. (新版关键步骤) 上传构建产物为工件
      - name: 上传 GitHub Pages 工件
        # uses: actions/upload-pages-artifact@v3
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          # 指定构建产物的目录，通常是 'build' 或 'dist'
          path: './dist'

      # 8. (新版关键步骤) 部署工件到 GitHub Pages
      - name: 部署到 GitHub Pages
        id: deployment
        # uses: actions/deploy-pages@v4
        uses: actions/deploy-pages@v3.0.2-node.24
          